name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  c:
    name: C library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      # Static is what an embedder links; shared is the stricter check. Building both
      # keeps the two configurations honest against each other.
      - name: Build static
        run: |
          cmake -S . -B build-static -DCMAKE_BUILD_TYPE=Release
          cmake --build build-static -j$(nproc)

      # -Wl,--no-undefined is the point of this job: it fails the link if core names a
      # symbol nothing in the closure defines, which is what "core stands alone" means.
      # A static archive would happily carry the same dangling reference.
      - name: Build shared, with symbol closure enforced
        run: |
          cmake -S . -B build-shared -DCMAKE_BUILD_TYPE=Release \
            -DFLOWI_CORE_SHARED=ON \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--no-undefined"
          cmake --build build-shared -j$(nproc)

      - name: Build with mimalloc
        run: |
          cmake -S . -B build-mi -DCMAKE_BUILD_TYPE=Release -DFLOWI_CORE_USE_MIMALLOC=ON
          cmake --build build-mi -j$(nproc)

      # The library must not have picked up a dependency of its own. Anything beyond
      # libz/libm/libc/ld means something leaked into the foundation.
      - name: Dependencies are only zlib, libm and libc
        run: |
          objdump -p build-shared/libflowi_core.so | grep NEEDED
          unexpected=$(objdump -p build-shared/libflowi_core.so \
            | awk '/NEEDED/ {print $2}' \
            | grep -vE '^(libz\.so|libm\.so|libc\.so|ld-linux)' || true)
          if [ -n "$unexpected" ]; then
            echo "unexpected DT_NEEDED: $unexpected" >&2
            exit 1
          fi

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      # The generated bindings are deliberately not rustfmt-formatted - api_gen emits
      # them pre-canonicalised and the drift gate compares bytes - so they are excluded
      # here exactly as the pre-commit hook excludes them.
      #
      # skip_children is what makes the exclusion hold: without it, rustfmt on a crate
      # root follows `mod generated;` and checks the very files the find excluded. It is
      # a nightly option, but passing it through --config is accepted on stable.
      - name: Format
        working-directory: rust
        run: |
          find . -name '*.rs' -not -path '*/generated/*' -not -path '*/target/*' \
            -print0 | xargs -0 rustfmt --edition 2021 --config skip_children=true --check

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Builds the C library through build.rs and links against it, so this also covers
      # the default `native` path.
      - name: Test
        working-directory: rust
        run: cargo test --workspace --locked

  codegen:
    name: Codegen is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Regenerates from api/*.def into a temp dir and compares against the committed
      # headers, bindings and export lists. Never mutates the tree; names the file that
      # drifted.
      - run: cargo regen-check
